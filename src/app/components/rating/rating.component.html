<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>rating</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="rating-title">
    <h2>como você avalia <br>
      sua experiência no app?</h2>
  </div>

  <div class="rating-buttons">
    <ion-button fill="clear" (click)="rate(1)">
      <ion-icon name="star" [color]="rating === 1 ? 'warning' : 'medium'"></ion-icon>
      <!-- color="warning" -->
    </ion-button>

    <ion-button fill="clear" (click)="rate(2)">
      <ion-icon name="star" [color]="rating <= 2 ? 'medium': 'warning'"></ion-icon>
    </ion-button>

    <ion-button fill="clear" (click)="rate(3)">
      <ion-icon name="star" [color]="rating <= 3 ? 'medium': 'warning'"></ion-icon>
    </ion-button>

    <ion-button fill="clear" (click)="rate(4)">
      <ion-icon name="star" [color]="rating <= 4 ? 'medium': 'warning'"></ion-icon>
    </ion-button>

    <ion-button fill="clear" (click)="rate(5)">
      <ion-icon name="star" [color]="rating <= 5 ? 'medium': 'warning'"></ion-icon>
    </ion-button>
  </div>

  <div class="rating-info">

    <!-- se for ruim, colocar campo de informação -->
    <div *ngIf="rating <= 3 && rating > 0">
      <form [formGroup]="ratingGroup" (submit)="send()">
        <ion-item lines="none">
          <ion-textarea formControlName="username" rows="6" fill="outline"
            placeholder="what can we improve?"></ion-textarea>
        </ion-item>

        <ion-button expand="block" color="primary" type="submit" [disabled]="ratingGroup.invalid">send</ion-button>
      </form>
    </div>

    <!-- se for bom, colocar o que gosta mais por  -->
    <div *ngIf="rating > 3">
      <p>o que você mais gosta no app?</p>

      <ion-chip>
        <ion-label>design bonito</ion-label>
        <ion-icon name="close"></ion-icon>
      </ion-chip>

      <ion-chip>
        <ion-label>bons restaurantes</ion-label>
        <ion-icon name="close"></ion-icon>
      </ion-chip>
    </div>

  </div>

</ion-content>
