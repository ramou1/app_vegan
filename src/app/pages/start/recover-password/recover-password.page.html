<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="closeRecover()">
        <ion-icon slot="icon-only" name="veg-arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>esqueceu a senha?</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="auth-kicker">vamos te ajudar</p>
  <h3>informe o e-mail de cadastro</h3>

  <form [formGroup]="recoverForm">
    <ion-item lines="none">
      <ion-input label="seu e-mail" labelPlacement="floating" type="email"
        formControlName="email"></ion-input>
    </ion-item>
  </form>
</ion-content>

<ion-footer class="ion-no-border ion-padding">
  <ion-button expand="block" (click)="recoverPassword()" [disabled]="recoverForm.invalid">recuperar minha senha</ion-button>
</ion-footer>
