<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
      <ion-title>{{event?.title}}</ion-title>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button (click)="openShare()">
        <ion-icon slot="icon-only" name="share-social-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <img src="../assets/images/{{event.image ? event.image : 'slider-default.png'}}">
  <h2>{{event.title}}</h2>
  <h4>{{event.startingDate}}, {{event.startingHour}}</h4>

  <div class="ion-padding">

    <ion-row>
      <ion-col size="10">
        <ion-button shape="round" size="small" fill="outline" expand="block" (click)="confirmPresence()">
          <ion-icon name="checkmark-circle-outline" color="primary"></ion-icon>
          quero ir
        </ion-button>
      </ion-col>

      <ion-col size="2">
        <ion-button shape="round" size="small" fill="solid" expand="block" (click)="presentEventActions(event)">
          <ion-icon slot="icon-only" md="ellipsis-vertical"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-item lines="none">
      <ion-icon name="location-outline" slot="start"></ion-icon>
      <ion-label>
        <p class="event-local"> {{ event?.local }} </p>
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-icon name="people-outline" slot="start"></ion-icon>
      <ion-label>
        <p class="event-local"> {{ event.confirmed? event.confirmed.length : '0' }} Confirmed</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <p class="event-description"> {{ event.description }} </p>
    </ion-item>
  </div>

</ion-content>
