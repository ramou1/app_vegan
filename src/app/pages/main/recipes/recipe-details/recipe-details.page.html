<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
      <ion-title>{{recipe?.title}}</ion-title>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content>

  <img src="../assets/images/{{recipe.image ? recipe.image : 'slider-default.png'}}">
  <h2>{{recipe.title}}</h2>
  <h4>{{recipe.creator}} | {{recipe.registerDate}}</h4>

  <div class="ion-padding">

    <ion-row class="recipe-info">
      <ion-col>
        <ion-icon name="time-outline"></ion-icon>
        <span>{{recipe.cookTime}}</span>
      </ion-col>
      <ion-col>
        <ion-icon name="bar-chart-outline"></ion-icon>
        <span>{{recipe.calories}}</span>
      </ion-col>
      <ion-col>
        <ion-icon name="people-outline"></ion-icon>
        <span>{{recipe.servings}}</span>
      </ion-col>
    </ion-row>

    <!-- <ion-item>
      <p class="recipe-instructions"> {{ recipe.instructions }} </p>
    </ion-item> -->

    <ion-item>
      <h3>instruções</h3>
      <p class="recipe-instructions">{{ recipe.instructions }}</p>
    </ion-item>

    <ion-item>
      <h3>ingredientes</h3>
      <p class="recipe-instructions">{{ recipe.ingredients }}</p>
    </ion-item>

  </div>

</ion-content>
