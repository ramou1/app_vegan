<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="veg-arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>nova receita</ion-title>
  </ion-toolbar>
</ion-header>

<div class="add-recipe-images"
  [ngStyle]="{'background-image': imageUrl ? 'url(' + imageUrl + ')' : 'url(../assets/images/default-events.png)'}">
  <ion-button shape="round" size="small" fill="solid" color="secondary" class="add-recipe-button"
    (click)="uploadImage()">
    <ion-icon slot="start" name="images-outline"></ion-icon>
    enviar imagens
  </ion-button>
</div>

<ion-content class="ion-padding">

  <ion-row>
    <ion-col size="auto">
      <ion-avatar>
        <img [src]="'../assets/images/' + (user.image || 'default-user.png')" [alt]="user.name">
      </ion-avatar>
    </ion-col>

    <ion-col class="second-column">
      <h4 class="recipe-creator-title">{{ user.name }}</h4>
      <h5 class="recipe-creator-subtitle">criador</h5>
    </ion-col>
  </ion-row>

  <form [formGroup]="recipeGroup">

    <ion-item lines="none">
      <ion-input type="text" formControlName="title" label="nome da receita" labelPlacement="floating"></ion-input>
    </ion-item>

    <ion-item lines="none" class="multiline-item">
      <ion-textarea
        rows="6"
        formControlName="ingredients"
        label="ingredientes"
        labelPlacement="floating"
        placeholder="um ingrediente por linha&#10;ex:&#10;2 xícaras de farinha&#10;1 xícara de leite vegetal"
        autoGrow="true"></ion-textarea>
    </ion-item>

    <ion-item lines="none" class="multiline-item">
      <ion-textarea
        rows="8"
        formControlName="instructions"
        label="instruções"
        labelPlacement="floating"
        placeholder="escreva o passo a passo&#10;use uma linha para cada etapa"
        autoGrow="true"></ion-textarea>
    </ion-item>

    <div class="three-columns">
      <ion-item lines="none">
        <ion-input type="number" formControlName="cookTime" label="tempo (min)" labelPlacement="floating"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-input type="number" formControlName="servings" label="porções" labelPlacement="floating"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-input type="number" formControlName="calories" label="calorias" labelPlacement="floating"></ion-input>
      </ion-item>
    </div>

  </form>
</ion-content>

<ion-footer class="ion-padding">
  <ion-button expand="block" shape="round" type="submit" [disabled]="!recipeGroup.valid" (click)="addRecipe()">
    nova receita
  </ion-button>
</ion-footer>
